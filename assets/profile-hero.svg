<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">sharmanhall — Practical automation for real-world workflows</title>
  <desc id="hero-desc">A typography-first graphite banner with a subtle blueprint grid and a blue-to-violet accent.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="96" y1="0" x2="1104" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="blueprint" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8b949e" stroke-opacity=".055"/>
      <circle cx="0" cy="0" r="1.25" fill="#58a6ff" fill-opacity=".18"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#background)"/>
  <rect width="1200" height="360" rx="22" fill="url(#blueprint)"/>
  <rect x=".75" y=".75" width="1198.5" height="358.5" rx="21.25" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <rect x="540" y="48" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="600" y="158" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="116" font-weight="700" letter-spacing="-4" text-anchor="middle">sharmanhall</text>
  <text x="600" y="230" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="450" letter-spacing="-.4" text-anchor="middle">Practical automation for</text>
  <text x="600" y="288" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="450" letter-spacing="-.4" text-anchor="middle">real-world workflows.</text>

  <rect x="160" y="323" width="880" height="2" rx="1" fill="url(#accent)" fill-opacity=".72"/>
  <circle cx="160" cy="324" r="5" fill="#58a6ff"/>
  <circle cx="1040" cy="324" r="5" fill="#8b5cf6"/>
</svg>
