name: Refresh profile cards

on:
  push:
    branches:
      - main
      - codex/profile-readme-overhaul
    paths:
      - .github/workflows/profile-cards.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'tyhallcsu/tyhallcsu'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare output directory
        run: mkdir -p profile

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e
        with:
          card: stats
          options: "username=tyhallcsu&show_icons=true&include_all_commits=true&count_private=false&hide_rank=true&disable_animations=true&border_radius=6&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9&icon_color=8B5CF6&border_color=30363D&custom_title=sharmanhall%27s%20GitHub%20Stats"
          path: profile/stats.svg
          token: ${{ github.token }}
          core_version: 2.1.3
          fail_on_error: "true"

      - name: Generate language card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e
        with:
          card: top-langs
          options: "username=tyhallcsu&layout=compact&langs_count=6&disable_animations=true&border_radius=6&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9&border_color=30363D&custom_title=Top%20Languages"
          path: profile/top-langs.svg
          token: ${{ github.token }}
          core_version: 2.1.3
          fail_on_error: "true"

      - name: Generate contribution streak
        uses: DenverCoder1/github-readme-streak-stats@a028da8aed0700a4d4cbe90f3482c2a2ee6188df
        with:
          options: "user=tyhallcsu&disable_animations=true&border_radius=6&background=0D1117&border=30363D&stroke=30363D&ring=58A6FF&fire=8B5CF6&currStreakNum=F0F6FC&sideNums=C9D1D9&currStreakLabel=58A6FF&sideLabels=C9D1D9&dates=8B949E"
          path: profile/streak.svg
          token: ${{ github.token }}

      - name: Generate top contributions
        uses: HwangTaehyun/github-repository-contribution-stats/action@95a90818c685ac6487d10750fbfc42bcdc5ef14f
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
        with:
          username: tyhallcsu
          output-file: profile/top-contributions.svg
          combine-all-yearly-contributions: "true"
          hide-contributor-rank: "false"
          order-by: contributions
          limit: "5"
          theme: dark
          title-color: 58A6FF
          text-color: C9D1D9
          icon-color: 8B5CF6
          bg-color: 0D1117
          border-color: 30363D
          border-radius: "6"
          hide-title: "true"
          hide-border: "false"
          custom-title: Top Contributions

      - name: Disable contribution card animation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "profile/top-contributions.svg";
          let svg = fs.readFileSync(file, "utf8");
          if (!svg.includes("</style>")) {
            throw new Error("Contribution card has no style block");
          }
          svg = svg.replace(
            "</style>",
            "* { animation: none !important; animation-delay: 0s !important; }</style>",
          );
          fs.writeFileSync(file, svg);
          NODE

      - name: Validate generated cards
        shell: bash
        run: |
          set -euo pipefail
          files=(
            profile/stats.svg
            profile/top-langs.svg
            profile/streak.svg
            profile/top-contributions.svg
          )

          for file in "${files[@]}"; do
            test -s "$file"
            xmllint --noout "$file"

            if grep -Eiq \
              'Something went wrong|Failed to fetch|<script|<foreignObject|<!DOCTYPE|<!ENTITY|javascript:|@import|<animate' \
              "$file"; then
              echo "Invalid or unsafe generated card: $file"
              exit 1
            fi

            if grep -Eiq \
              "<(image|use)[^>]+(href|xlink:href)=[\"']https?://" \
              "$file"; then
              echo "Remote image resource detected: $file"
              exit 1
            fi
          done

      - name: Commit refreshed cards
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "Card updates require a branch ref."
            exit 1
          fi

          git add -- \
            profile/stats.svg \
            profile/top-langs.svg \
            profile/streak.svg \
            profile/top-contributions.svg

          if git diff --cached --quiet; then
            echo "Cards are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh activity cards"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
